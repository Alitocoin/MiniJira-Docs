openapi: 3.0.3
info:
  title: MiniJira API
  description: |
    API REST del backend de MiniJira. Implementada con Spring Boot 3 / Java 21.
    Generada a partir del codigo fuente real (branch `development`).

    **Autenticacion**: el sistema actual no implementa autenticacion. Todos los
    endpoints son publicos. No existen rutas `/api/auth/*` en el codigo.

    **CORS**: permitido desde `http://localhost:5173` y `http://localhost:3000`
    (configurable via env var `cors.allowed-origins`).
  version: 1.0.0
  contact:
    name: Equipo DevForce

servers:
  - url: http://localhost:8080/api
    description: Desarrollo local

tags:
  - name: Tasks
    description: Gestion de tareas del tablero Kanban
  - name: Users
    description: Gestion de usuarios
  - name: Projects
    description: Gestion de proyectos

paths:

  # ─── TASKS ────────────────────────────────────────────────────────────────

  /tasks:
    get:
      tags: [Tasks]
      summary: Listar todas las tareas
      operationId: getAllTasks
      responses:
        '200':
          description: Lista de tareas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Tasks]
      summary: Crear una tarea
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
            example:
              title: "Implementar login"
              description: "Pantalla de autenticacion con validaciones"
              status: "TODO"
              storyPoints: 3
              estimatedHours: 4.5
              startDate: "2026-05-12"
              endDate: "2026-05-14"
              assigneeId: 1
              projectId: 2
      responses:
        '201':
          description: Tarea creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{id}:
    get:
      tags: [Tasks]
      summary: Obtener tarea por ID
      operationId: getTaskById
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Tarea encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Tasks]
      summary: Actualizar tarea completa
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskRequest'
      responses:
        '200':
          description: Tarea actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Tasks]
      summary: Eliminar tarea
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Tarea eliminada
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tasks/{id}/status:
    patch:
      tags: [Tasks]
      summary: Actualizar solo el estado de una tarea
      operationId: updateTaskStatus
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdateRequest'
            example:
              status: "IN_PROGRESS"
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── USERS ────────────────────────────────────────────────────────────────

  /users:
    get:
      tags: [Users]
      summary: Listar todos los usuarios
      operationId: getAllUsers
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Users]
      summary: Crear un usuario
      operationId: createUser
      description: |
        Valida unicidad de `username` y `email`. Devuelve 409 si ya existen.
        El campo `password` no existe en este sistema (no hay autenticacion implementada).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
            example:
              username: "jdoe"
              email: "jdoe@example.com"
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{id}:
    get:
      tags: [Users]
      summary: Obtener usuario por ID
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Users]
      summary: Actualizar usuario
      operationId: updateUser
      description: Valida unicidad de `username` y `email` contra otros usuarios.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Users]
      summary: Eliminar usuario
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Usuario eliminado
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ─── PROJECTS ─────────────────────────────────────────────────────────────

  /projects:
    get:
      tags: [Projects]
      summary: Listar todos los proyectos
      operationId: getAllProjects
      responses:
        '200':
          description: Lista de proyectos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Projects]
      summary: Crear un proyecto
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
            example:
              name: "Backend API v2"
              description: "Refactor del modulo de autenticacion"
      responses:
        '201':
          description: Proyecto creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /projects/{id}:
    get:
      tags: [Projects]
      summary: Obtener proyecto por ID
      operationId: getProjectById
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Proyecto encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags: [Projects]
      summary: Actualizar proyecto
      operationId: updateProject
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
      responses:
        '200':
          description: Proyecto actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags: [Projects]
      summary: Eliminar proyecto
      operationId: deleteProject
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Proyecto eliminado
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

# ─── COMPONENTS ───────────────────────────────────────────────────────────────

components:

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        example: 1

  schemas:

    TaskStatus:
      type: string
      enum: [TODO, IN_PROGRESS, DONE]
      description: Estado de la tarea en el tablero Kanban

    TaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 300
          description: Titulo de la tarea (obligatorio)
          example: "Implementar login"
        description:
          type: string
          nullable: true
          description: Descripcion larga (TEXT, sin limite de largo)
          example: "Pantalla de autenticacion con validaciones"
        status:
          $ref: '#/components/schemas/TaskStatus'
          description: Estado inicial. Default del backend es TODO si no se envia.
        storyPoints:
          type: integer
          nullable: true
          description: Estimacion en puntos de historia
          example: 3
        estimatedHours:
          type: number
          format: double
          nullable: true
          description: Estimacion en horas
          example: 4.5
        startDate:
          type: string
          format: date
          nullable: true
          description: Fecha de inicio (ISO 8601)
          example: "2026-05-12"
        endDate:
          type: string
          format: date
          nullable: true
          description: Fecha de vencimiento (ISO 8601)
          example: "2026-05-14"
        assigneeId:
          type: integer
          format: int64
          nullable: true
          description: ID del usuario asignado. null = sin asignar.
          example: 1
        projectId:
          type: integer
          format: int64
          nullable: true
          description: ID del proyecto asociado. null = sin proyecto.
          example: 2

    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 42
        title:
          type: string
          example: "Implementar login"
        description:
          type: string
          nullable: true
          example: "Pantalla de autenticacion con validaciones"
        status:
          $ref: '#/components/schemas/TaskStatus'
        storyPoints:
          type: integer
          nullable: true
          example: 3
        estimatedHours:
          type: number
          format: double
          nullable: true
          example: 4.5
        startDate:
          type: string
          format: date
          nullable: true
          example: "2026-05-12"
        endDate:
          type: string
          format: date
          nullable: true
          example: "2026-05-14"
        createdAt:
          type: string
          format: date-time
          example: "2026-05-11T10:30:00"
        assignee:
          $ref: '#/components/schemas/UserResponse'
          nullable: true
        project:
          $ref: '#/components/schemas/ProjectResponse'
          nullable: true

    StatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/TaskStatus'

    UserRequest:
      type: object
      required: [username, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 100
          description: Nombre de usuario unico en el sistema
          example: "jdoe"
        email:
          type: string
          format: email
          maxLength: 255
          description: Email unico en el sistema
          example: "jdoe@example.com"

    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        username:
          type: string
          example: "jdoe"
        email:
          type: string
          format: email
          example: "jdoe@example.com"
        createdAt:
          type: string
          format: date-time
          example: "2026-05-11T09:00:00"

    ProjectRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
          description: Nombre del proyecto (obligatorio)
          example: "Backend API v2"
        description:
          type: string
          nullable: true
          description: Descripcion larga (TEXT)
          example: "Refactor del modulo de autenticacion"

    ProjectResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 2
        name:
          type: string
          example: "Backend API v2"
        description:
          type: string
          nullable: true
          example: "Refactor del modulo de autenticacion"
        createdAt:
          type: string
          format: date-time
          example: "2026-05-10T08:00:00"

    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
          description: Momento en que ocurrio el error (UTC local del servidor)
          example: "2026-05-11T10:35:00"
        status:
          type: integer
          description: Codigo HTTP
          example: 404
        error:
          type: string
          description: Texto del codigo HTTP
          example: "Not Found"
        message:
          type: string
          description: Mensaje de negocio o validacion
          example: "Task con id 99 no encontrado"
        path:
          type: string
          description: URI de la request que genero el error
          example: "/api/tasks/99"

  responses:
    BadRequest:
      description: Datos de entrada invalidos (fallo de validacion Bean Validation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-05-11T10:35:00"
            status: 400
            error: "Bad Request"
            message: "El titulo es obligatorio"
            path: "/api/tasks"

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-05-11T10:35:00"
            status: 404
            error: "Not Found"
            message: "Task con id 99 no encontrado"
            path: "/api/tasks/99"

    Conflict:
      description: Conflicto de unicidad (username o email ya existe)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-05-11T10:35:00"
            status: 409
            error: "Conflict"
            message: "Ya existe un usuario con el email: jdoe@example.com"
            path: "/api/users"

    InternalServerError:
      description: Error interno inesperado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            timestamp: "2026-05-11T10:35:00"
            status: 500
            error: "Internal Server Error"
            message: "Ha ocurrido un error inesperado"
            path: "/api/tasks"
